[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "helloagent"
version = "0.1.0"
description = "A locally built learning framework for Chapter 7 agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-search-results>=2.4.2",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/helloagent"]
